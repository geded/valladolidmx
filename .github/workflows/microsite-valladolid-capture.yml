name: Capture Valladolid microsite review

on:
  push:
    branches:
      - design/destination-microsite-premium-review-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Stage approved review media
        shell: bash
        run: |
          mkdir -p public/review-media
          origin="https://valladolidmx.lovable.app/api/public/studio-media/governed/v1p1c"
          for file in destination-cover.jpg destination-gallery-1.jpg destination-gallery-2.jpg experience-cover.jpg experience-gallery-1.jpg experience-gallery-2.jpg hotel-cover.jpg hotel-gallery-1.jpg hotel-gallery-2.jpg restaurant-cover.jpg restaurant-gallery-1.jpg restaurant-gallery-2.jpg; do
            curl --fail --location --retry 3 "$origin/$file" --output "public/review-media/$file"
          done
          sed -i 's#/api/public/studio-media/governed/v1p1c#/review-media#g' src/components/destination-premium/destination-premium-content.ts
      - name: Start preview
        run: bun run dev -- --host 127.0.0.1 > /tmp/vmx-microsite-vite.log 2>&1 &
      - run: bunx wait-on http://127.0.0.1:8080/lovable/g4-destination-microsite-preview --timeout 120000
      - run: bunx playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page --wait-for-timeout 3000 http://127.0.0.1:8080/lovable/g4-destination-microsite-preview micrositio-valladolid-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: micrositio-valladolid-desktop
          path: micrositio-valladolid-desktop.png
          if-no-files-found: error
