name: Governance Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run canonical full validation on PR
        if: github.event_name == 'pull_request'
        run: bun scripts/governance/validate-full-suite.mjs --base=${{ github.event.pull_request.base.sha }}

      - name: Run canonical full validation on main
        if: github.event_name == 'push'
        run: bun scripts/governance/validate-full-suite.mjs
