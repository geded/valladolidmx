name: Temporary Home Premium Desktop Capture

on:
  push:
    branches:
      - design/home-premium-system-review-v1
    paths:
      - .github/workflows/home-premium-desktop-capture.yml
      - src/components/home-premium/HomePremiumSurface.tsx
      - src/components/home-premium/home-premium-content.ts
      - src/routes/lovable/g4-home-premium-preview.tsx
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium

      - name: Start visual preview
        run: |
          bun run dev --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lovable/g4-home-premium-preview > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat preview.log
          exit 1

      - name: Capture desktop Home
        run: |
          mkdir -p visual-review
          bunx playwright@1.55.0 screenshot \
            --browser chromium \
            --viewport-size "1440,1000" \
            --full-page \
            http://127.0.0.1:4173/lovable/g4-home-premium-preview \
            visual-review/home-premium-desktop-1440.png

      - name: Upload desktop capture
        uses: actions/upload-artifact@v4
        with:
          name: home-premium-desktop-1440
          path: visual-review/home-premium-desktop-1440.png
          if-no-files-found: error
          retention-days: 7
