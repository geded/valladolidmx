name: Capture territorial listing review
on:
  push:
    branches: [design/territorial-listing-premium-review-v1]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Stage governed review media
        shell: bash
        run: |
          mkdir -p public/review-media
          origin="https://valladolidmx.lovable.app/api/public/studio-media/governed/v1p1c"
          for file in hotel-cover.jpg hotel-gallery-1.jpg hotel-gallery-2.jpg destination-gallery-1.jpg experience-gallery-1.jpg; do
            curl --fail --location --retry 3 "$origin/$file" --output "public/review-media/$file"
          done
          sed -i 's#/api/public/studio-media/governed/v1p1c#/review-media#g' src/components/listing-premium/TerritorialListingReviewSurface.tsx
      - run: bun run dev -- --host 127.0.0.1 > /tmp/listing-responsive.log 2>&1 &
      - run: bunx wait-on http://127.0.0.1:8080/lovable/territorial-listing-premium-preview --timeout 120000
      - name: Capture desktop, iPad and mobile
        run: |
          bunx playwright screenshot --browser chromium --viewport-size "1440,1000" --full-page --wait-for-timeout 3000 http://127.0.0.1:8080/lovable/territorial-listing-premium-preview listing-desktop.png
          bunx playwright screenshot --browser chromium --viewport-size "768,1024" --full-page --wait-for-timeout 3000 http://127.0.0.1:8080/lovable/territorial-listing-premium-preview listing-ipad.png
          bunx playwright screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 3000 http://127.0.0.1:8080/lovable/territorial-listing-premium-preview listing-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: territorial-listing-responsive-review
          path: |
            listing-desktop.png
            listing-ipad.png
            listing-mobile.png
          if-no-files-found: error
