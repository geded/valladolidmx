<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sin conexión — Valladolid.mx</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #26251f;
        background: #ffffff;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      }
      section { width: min(100%, 620px); text-align: center; }
      img { width: 88px; height: 88px; object-fit: contain; }
      .eyebrow { margin: 24px 0 8px; color: #776848; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 8vw, 52px); line-height: 1.08; }
      p { margin: 16px auto 0; max-width: 500px; color: #656258; font-size: 16px; line-height: 1.6; }
      .status { margin-top: 22px; font-size: 13px; }
      button {
        margin-top: 28px;
        min-height: 46px;
        border: 0;
        border-radius: 6px;
        padding: 0 24px;
        color: #ffffff;
        background: #35352d;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #eaa840; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <img src="/logo.png" alt="Valladolid.mx" />
        <p class="eyebrow">Modo sin conexión</p>
        <h1>Estás sin conexión</h1>
        <p>No pudimos alcanzar la red. En cuanto recuperes conexión volveremos a cargar el sitio actualizado.</p>
        <p class="status" role="status" aria-live="polite" id="status">Esperando conexión…</p>
        <button type="button" id="retry">Reintentar</button>
      </section>
    </main>
    <script>
      (() => {
        const status = document.getElementById("status");
        let recovering = false;
        async function recover() {
          if (recovering || !navigator.onLine) return;
          recovering = true;
          if (status) status.textContent = "Recuperando conexión…";
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registrations.map((registration) => registration.unregister()));
            }
            if ("caches" in window) {
              const names = await caches.keys();
              const appCaches = names.filter((name) => /workbox|html-pages|static-images/i.test(name));
              await Promise.allSettled(appCaches.map((name) => caches.delete(name)));
            }
          } finally {
            location.replace("/?offline-recovered=1");
          }
        }
        document.getElementById("retry")?.addEventListener("click", recover);
        window.addEventListener("online", recover);
        if (navigator.onLine) recover();
      })();
    </script>
  </body>
</html>
